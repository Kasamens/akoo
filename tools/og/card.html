<!doctype html>
<!-- Link-preview image maker (Open Graph / Twitter, 1200×630).
     Shows a real lesson stage in the approved look with a name strip underneath.
     Usage: serve the site, open tools/og/card.html?c=de&l=akoo (c = course, l = lesson id),
     and screenshot the 1200×630 window. tools/og/make.sh does this with headless Chrome. -->
<html lang="en" data-theme="dark">
<meta charset="utf-8">
<title>og card</title>
<script>try { localStorage.setItem('akoo:prefs', JSON.stringify({ theme: 'dark' })); } catch (e) {}</script>
<link rel="stylesheet" href="../../shared/fonts/fonts.css">
<link rel="stylesheet" href="../../shared/style.css">
<style>
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
.shot { position: absolute; left: 0; top: 0; width: 1200px; height: 540px; overflow: hidden; }
.shot iframe { position: absolute; border: 0; transform-origin: 0 0; }
.strip { position: absolute; left: 0; right: 0; bottom: 0; height: 90px; display: flex; align-items: center; gap: 22px; padding: 0 44px; background: var(--bg) var(--grain); border-top: 1px solid var(--line); }
.strip h1 { font-size: 64px; line-height: 1; padding-top: 8px; }
.strip p { margin: 0; font-size: 24px; color: var(--muted); }
.strip p b { color: var(--fg); font-weight: 600; }
.strip .bird { margin-left: auto; font-size: 46px; }
</style>
<div class="shot"><iframe id="f" width="1100" height="1000"></iframe></div>
<div class="strip"><h1>Akoo</h1><p id="t"></p><span class="bird" aria-hidden="true">🦜</span></div>
<script>
const q = new URLSearchParams(location.search), c = q.get('c') || 'de', l = q.get('l') || 'akoo';
// keep these in step with each course page's <title>
const LINE = { de: '<b>German</b>, A1 to B1', fr: '<b>French</b> from A1', both: '<b>German or French</b>, A1 to B1' };
document.getElementById('t').innerHTML = LINE[q.get('both') ? 'both' : c] + ' · one rule a week, made interactive';
const f = document.getElementById('f');
f.onload = () => {
  const d = f.contentDocument, st = d.getElementById('stage');
  // make the stage exactly 1200:540 so the camera frames the scene for this crop, then scale it up to fill
  const w = st.getBoundingClientRect().width;
  d.head.insertAdjacentHTML('beforeend', `<style>#stage { height: ${Math.round(w * 540 / 1200)}px !important; } #fbtn, .fb-fab, .feedback { display: none !important; }</style>`);
  setTimeout(() => {
    const r = st.getBoundingClientRect(), s = 1200 / r.width;
    f.style.transform = `scale(${s}) translate(${-r.left}px, ${-r.top}px)`;
    setTimeout(() => { document.title = 'ready'; }, 4000); // make.sh forces reduced motion, which skips the paint-on reveal
  }, 300);
};
f.src = `../../${c}/#${l}`;
</script>
